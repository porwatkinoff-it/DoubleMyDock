name: Build DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v2.0.0 (пусто — без релиза)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          echo "::notice::$(xcodebuild -version | head -1), $(swiftc --version 2>&1 | head -1)"
          swiftc --version

      - name: Set version
        if: inputs.version != ''
        run: |
          V="${{ inputs.version }}"; V="${V#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist

      - name: Import signing certificate
        env:
          SIGN_P12: ${{ secrets.SIGN_P12 }}
          SIGN_P12_PASSWORD: ${{ secrets.SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$SIGN_P12" ]; then echo "::warning::Нет сертификата — подпись ad-hoc"; exit 0; fi
          KC="$RUNNER_TEMP/sign.keychain-db"; KP=$(openssl rand -hex 12)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$SIGN_P12" | base64 --decode > "$RUNNER_TEMP/s.p12"
          security import "$RUNNER_TEMP/s.p12" -k "$KC" -P "$SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          H=$(security find-certificate -c "DoubleMyDock Self-Signed" -Z "$KC" | awk '/SHA-1/{print $3}')
          echo "SIGN_ID=$H" >> "$GITHUB_ENV"
          echo "::notice::Подпись сертификатом $H"

      - name: Build
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log
          codesign -dr - build/DoubleMyDock.app 2>&1 | tail -1 | sed 's/^/::notice::/'

      - name: Report errors
        if: failure()
        run: |
          grep -E "error:|warning: .*(isolated|Sendable)" build.log | head -20 | while IFS= read -r l; do
            echo "::error::${l//$'\n'/ }"
          done
          tail -5 build.log | while IFS= read -r l; do echo "::warning::$l"; done

      - uses: actions/upload-artifact@v5
        with:
          name: DoubleMyDock
          path: dist/DoubleMyDock.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" dist/DoubleMyDock.dmg --target "$GITHUB_SHA" \
            --title "DoubleMyDock $VERSION" --notes-file RELEASE_NOTES.md
