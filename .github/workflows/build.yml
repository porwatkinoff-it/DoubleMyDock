name: Build DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
          swiftc --version

      - name: Build
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DoubleMyDock
          path: dist/DoubleMyDock.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/DoubleMyDock.dmg \
            --title "DoubleMyDock $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
