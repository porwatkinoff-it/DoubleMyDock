name: Build DMG

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          echo "::notice::$(xcodebuild -version | head -1), $(swiftc --version 2>&1 | head -1)"
          swiftc --version

      - name: Build
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "error:|warning: .*(isolated|Sendable)" build.log | head -20 | while IFS= read -r l; do
            echo "::error::${l//$'\n'/ }"
          done
          tail -5 build.log | while IFS= read -r l; do echo "::warning::$l"; done

      - uses: actions/upload-artifact@v5
        with:
          name: DoubleMyDock
          path: dist/DoubleMyDock.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/DoubleMyDock.dmg \
            --title "DoubleMyDock $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
